<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Termous</title>
    <script>
      (() => {
        const requestedTheme = new URLSearchParams(window.location.search).get('theme')
        const fallbackTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = requestedTheme === 'dark' || requestedTheme === 'light'
          ? requestedTheme
          : fallbackTheme
      })()
    </script>
    <style>
      :root {
        color-scheme: dark;
        --startup-bg: #181c24;
        --startup-border: #303745;
        --startup-title: #f3f5f9;
        --startup-muted: #929cab;
        --startup-track: rgb(255 255 255 / 9%);
        --startup-accent: #61a8ff;
        --startup-shadow: rgb(0 0 0 / 22%);
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --startup-bg: #f7f8fa;
        --startup-border: #d9dde5;
        --startup-title: #171c24;
        --startup-muted: #6d7786;
        --startup-track: rgb(30 42 58 / 10%);
        --startup-accent: #1f6feb;
        --startup-shadow: rgb(31 45 66 / 12%);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--startup-bg);
        color: var(--startup-title);
        font-family: "Segoe UI Variable", "Segoe UI", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }

      .startup-window {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        border: 1px solid var(--startup-border);
        background: var(--startup-bg);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 3%), 0 18px 46px var(--startup-shadow);
      }

      .startup-content {
        display: grid;
        width: 280px;
        justify-items: center;
        transform: translateY(-2px);
      }

      .startup-icon {
        width: 58px;
        height: 58px;
        object-fit: contain;
        filter: drop-shadow(0 10px 18px rgb(0 0 0 / 22%));
        animation: startup-icon 1.8s ease-in-out infinite;
      }

      :root[data-theme="light"] .startup-icon {
        filter: drop-shadow(0 10px 18px rgb(30 44 64 / 12%));
      }

      .startup-title {
        margin: 14px 0 0;
        color: inherit;
        font-size: 20px;
        font-weight: 720;
        letter-spacing: 0;
        line-height: 1.2;
      }

      .startup-status {
        display: inline-flex;
        min-height: 20px;
        align-items: center;
        gap: 8px;
        margin-top: 9px;
        color: var(--startup-muted);
        font-size: 12px;
        line-height: 20px;
      }

      .startup-status::before {
        width: 6px;
        height: 6px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--startup-accent);
        box-shadow: 0 0 0 4px rgb(97 168 255 / 10%);
        content: "";
        animation: startup-pulse 1.4s ease-in-out infinite;
      }

      .startup-track {
        position: relative;
        width: 248px;
        height: 3px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--startup-track);
      }

      .startup-track > span {
        position: absolute;
        inset-block: 0;
        width: 38%;
        border-radius: inherit;
        background: var(--startup-accent);
        animation: startup-track 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      body[data-phase="error"] {
        --startup-accent: #e4a853;
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-icon,
        .startup-status::before {
          animation: none;
        }

        .startup-track > span {
          inset-inline-start: 31%;
          animation: startup-pulse 1.4s ease-in-out infinite;
        }
      }

      @keyframes startup-icon {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }

      @keyframes startup-track {
        0% { transform: translateX(-110%); opacity: 0.45; }
        45% { opacity: 1; }
        100% { transform: translateX(370%); opacity: 0.45; }
      }

      @keyframes startup-pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <main class="startup-window" role="status" aria-live="polite" aria-atomic="true">
      <div class="startup-content">
        <img class="startup-icon" src="./termous-icon.png" alt="" />
        <h1 class="startup-title">Termous</h1>
        <div id="startup-status" class="startup-status">Starting core services</div>
        <div class="startup-track" aria-hidden="true"><span></span></div>
      </div>
    </main>
    <script>
      (() => {
        const isChinese = navigator.language === 'zh-CN' || navigator.language.startsWith('zh')
        const messages = isChinese
          ? {
              core: '正在启动核心服务',
              workspace: '正在准备工作区',
              error: '启动未完成',
            }
          : {
              core: 'Starting core services',
              workspace: 'Preparing workspace',
              error: 'Startup did not complete',
            }
        const status = document.getElementById('startup-status')
        document.documentElement.lang = isChinese ? 'zh-CN' : 'en-US'
        window.termousStartup = {
          setTheme(theme) {
            document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'
          },
          setPhase(phase) {
            const nextPhase = Object.prototype.hasOwnProperty.call(messages, phase) ? phase : 'core'
            document.body.dataset.phase = nextPhase
            if (status) status.textContent = messages[nextPhase]
          },
        }
        window.termousStartup.setPhase('core')
      })()
    </script>
  </body>
</html>
