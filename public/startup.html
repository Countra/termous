<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Termous</title>
    <script>
      (() => {
        const requestedTheme = new URLSearchParams(window.location.search).get('theme')
        const fallbackTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = requestedTheme === 'dark' || requestedTheme === 'light'
          ? requestedTheme
          : fallbackTheme
      })()
    </script>
    <style>
      :root {
        color-scheme: dark;
        --startup-bg: #181c24;
        --startup-border: #303745;
        --startup-title: #f3f5f9;
        --startup-muted: #929cab;
        --startup-track: rgb(255 255 255 / 9%);
        --startup-accent: #61a8ff;
        --startup-shadow: rgb(0 0 0 / 22%);
        --startup-success: #65c8a2;
        --startup-error: #eeae68;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --startup-bg: #f7f8fa;
        --startup-border: #d9dde5;
        --startup-title: #171c24;
        --startup-muted: #6d7786;
        --startup-track: rgb(30 42 58 / 10%);
        --startup-accent: #1f6feb;
        --startup-shadow: rgb(31 45 66 / 12%);
        --startup-success: #218461;
        --startup-error: #986015;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--startup-bg);
        color: var(--startup-title);
        font-family: "Segoe UI Variable", "Segoe UI", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }

      .startup-window {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        width: 100%;
        height: 100%;
        place-items: center;
        border: 1px solid var(--startup-border);
        background: var(--startup-bg);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 3%), 0 18px 46px var(--startup-shadow);
      }

      .startup-content {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        width: min(280px, calc(100% - 48px));
        min-width: 0;
        justify-items: center;
        transform: translateY(-2px);
      }

      .startup-icon {
        width: 58px;
        height: 58px;
        object-fit: contain;
        filter: drop-shadow(0 10px 18px rgb(0 0 0 / 22%));
        animation: startup-icon 1.8s ease-in-out infinite;
      }

      :root[data-theme="light"] .startup-icon {
        filter: drop-shadow(0 10px 18px rgb(30 44 64 / 12%));
      }

      .startup-title {
        margin: 14px 0 0;
        color: inherit;
        font-size: 20px;
        font-weight: 720;
        letter-spacing: 0;
        line-height: 1.2;
      }

      .startup-status {
        display: inline-flex;
        min-height: 20px;
        align-items: center;
        gap: 8px;
        margin-top: 9px;
        color: var(--startup-muted);
        font-size: 12px;
        line-height: 20px;
      }

      .startup-status::before {
        width: 6px;
        height: 6px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--startup-accent);
        box-shadow: 0 0 0 4px rgb(97 168 255 / 10%);
        content: "";
        animation: startup-pulse 1.4s ease-in-out infinite;
      }

      .startup-track {
        position: relative;
        width: min(248px, 100%);
        height: 3px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--startup-track);
      }

      .startup-track > span {
        position: absolute;
        inset-block: 0;
        inset-inline-start: 0;
        width: 38%;
        border-radius: inherit;
        background: var(--startup-accent);
        animation: startup-track 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: transform, opacity;
      }

      body[data-phase="error"] {
        --startup-accent: var(--startup-error);
      }

      body[data-phase="database-completed"] {
        --startup-accent: var(--startup-success);
      }

      body[data-phase="database-completed"] .startup-status::before {
        width: 11px;
        height: 6px;
        border-radius: 0;
        border-inline-start: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        background: none;
        color: var(--startup-success);
        box-shadow: none;
        transform: translateY(-2px) rotate(-45deg);
      }

      body[data-phase="database-completed"] .startup-icon,
      body[data-phase="database-completed"] .startup-status::before,
      body[data-phase="error"] .startup-icon,
      body[data-phase="error"] .startup-status::before {
        animation: none;
      }

      body[data-phase="database-completed"] .startup-track,
      body[data-phase="error"] .startup-track {
        visibility: hidden;
      }

      body[data-phase="error"] .startup-track { display: none; }

      [hidden] { display: none !important; }

      .startup-description,
      .startup-feedback {
        margin: 12px 0 0;
        color: var(--startup-muted);
        font-size: 12px;
        line-height: 1.65;
        text-align: center;
        overflow-wrap: anywhere;
      }

      .startup-description { white-space: pre-line; }

      .startup-details {
        width: 100%;
        min-width: 0;
        margin-top: 16px;
        border-block: 1px solid var(--startup-border);
        color: var(--startup-muted);
        font-size: 12px;
        -webkit-app-region: no-drag;
      }

      .startup-details summary {
        padding: 10px 0;
        cursor: pointer;
      }

      .startup-details pre {
        max-height: min(180px, 30vh);
        margin: 0 0 12px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-family: Consolas, "SFMono-Regular", monospace;
        font-size: 11px;
        line-height: 1.65;
        user-select: text;
      }

      .startup-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 18px;
        -webkit-app-region: no-drag;
      }

      .startup-actions button {
        min-height: 32px;
        padding: 5px 12px;
        border: 1px solid var(--startup-border);
        border-radius: 6px;
        background: var(--startup-track);
        color: var(--startup-title);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      .startup-actions button:hover { border-color: var(--startup-muted); }
      .startup-actions button:disabled { opacity: 0.6; cursor: wait; }
      .startup-actions button:focus-visible,
      .startup-details summary:focus-visible {
        outline: 2px solid var(--startup-accent);
        outline-offset: 3px;
      }

      body[data-phase="error"] .startup-window,
      body[data-attention="true"] .startup-window {
        overflow-y: auto;
        align-items: safe center;
        padding-block: 24px;
        -webkit-app-region: no-drag;
      }

      body[data-phase="error"] .startup-content,
      body[data-attention="true"] .startup-content {
        width: min(460px, calc(100% - 48px));
        transform: none;
      }

      body[data-phase="error"] .startup-icon { width: 44px; height: 44px; }
      body[data-phase="error"] .startup-status { color: var(--startup-error); font-weight: 600; }
      body[data-phase="error"] .startup-description { user-select: text; }

      @media (prefers-reduced-motion: reduce) {
        .startup-icon,
        .startup-status::before,
        .startup-track > span {
          animation: none;
          will-change: auto;
        }
      }

      @keyframes startup-icon {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }

      @keyframes startup-track {
        0% { transform: translateX(-110%); opacity: 0.45; }
        45% { opacity: 1; }
        100% { transform: translateX(370%); opacity: 0.45; }
      }

      @keyframes startup-pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <main class="startup-window">
      <div class="startup-content">
        <img class="startup-icon" src="./termous-icon.png" alt="" />
        <h1 class="startup-title">Termous</h1>
        <div id="startup-status" class="startup-status" role="status" aria-live="polite" aria-atomic="true">Starting</div>
        <p id="startup-description" class="startup-description" hidden></p>
        <div class="startup-track" aria-hidden="true"><span></span></div>
        <details id="startup-details" class="startup-details" hidden>
          <summary id="startup-details-label">Technical details</summary>
          <pre id="startup-details-text" tabindex="0"></pre>
        </details>
        <div id="startup-actions" class="startup-actions" hidden>
          <button id="startup-copy" type="button">Copy diagnostics</button>
          <button id="startup-logs" type="button">Open logs</button>
          <button id="startup-exit" type="button">Exit</button>
        </div>
        <p id="startup-feedback" class="startup-feedback" role="status" aria-live="polite" hidden></p>
      </div>
    </main>
    <script src="./startup.js"></script>
  </body>
</html>
