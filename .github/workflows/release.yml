name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version; CLI/API --ref must select the matching protected v* tag
        required: true
        default: 0.3.0
  push:
    tags:
      - v*
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  metadata:
    name: Resolve immutable release metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      source_lock: ${{ steps.sources.outputs.source_lock }}
      buildtools_sha: ${{ steps.sources.outputs.buildtools_sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_date: ${{ steps.release.outputs.release_date }}
      tag: ${{ steps.release.outputs.tag }}
      termous_sha: ${{ steps.termous.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          export LC_ALL=C
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != v* ]]; then
            echo "Release 只能从 v 开头的标签运行，禁止从任意分支读取发布凭据。" >&2
            exit 1
          fi
          if [[ "$REF_PROTECTED" != "true" ]]; then
            echo "Release 标签必须由 GitHub ruleset 或标签保护规则保护。" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_VERSION" != "$version" ]]; then
            echo "手动输入版本必须与所选标签一致: $INPUT_VERSION != $version" >&2
            exit 1
          fi
          release_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.([0-9A-Za-z-]+))*)?$'
          if (( ${#version} == 0 || ${#version} > 64 )) ||
             [[ ! "$version" =~ $release_pattern ]] ||
             [[ "${version,,}" == *arm64* ]]; then
            echo "Release 版本不符合受支持的 SemVer 子集: $version" >&2
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
            IFS='.' read -r -a identifiers <<< "${version#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ &&
                    ${#identifier} -gt 1 &&
                    "$identifier" == 0* ]]; then
                echo "数字 prerelease 标识符不能有前导零: $identifier" >&2
                exit 1
              fi
            done
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "release_date=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> "$GITHUB_OUTPUT"
      - name: Checkout the release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: web
          persist-credentials: false
          fetch-depth: 1
      - name: Verify and pin Termous tag
        id: termous
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          sha="$(git -C web rev-parse HEAD)"
          tag_sha="$(git -C web rev-parse "$RELEASE_TAG^{commit}")"
          event_sha="$(git -C web rev-parse "$EVENT_SHA^{commit}")"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ||
                "$sha" != "$tag_sha" ||
                "$sha" != "$event_sha" ]]; then
            echo "Termous Release 标签不存在或没有解析到当前 commit。" >&2
            exit 1
          fi
          echo "Resolved Termous commit: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout buildtools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Countra/termous-buildtools
          ref: main
          path: termous-buildtools
          token: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Resolve configured component revisions
        id: sources
        shell: bash
        env:
          WEB_SHA: ${{ steps.termous.outputs.sha }}
          TERMOUS_REPOSITORIES_READ_TOKEN: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}
        run: python termous-buildtools/ci.py resolve --web-sha "$WEB_SHA"
  prepare-release:
    name: Prepare Draft Release
    needs: metadata
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    outputs:
      source_lock: ${{ needs.metadata.outputs.source_lock }}
      buildtools_sha: ${{ needs.metadata.outputs.buildtools_sha }}
      prerelease: ${{ needs.metadata.outputs.prerelease }}
      release_date: ${{ needs.metadata.outputs.release_date }}
      tag: ${{ needs.metadata.outputs.tag }}
      termous_sha: ${{ needs.metadata.outputs.termous_sha }}
      version: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Checkout pinned Termous
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.metadata.outputs.termous_sha }}
          path: web
          persist-credentials: false
      - name: Generate release notes
        shell: pwsh
        env:
          TERMOUS_CHANGELOG_FILE: ${{ github.workspace }}/web/docs/CHANGELOG.md
          TERMOUS_RELEASE_NOTES_FILE: ${{ github.workspace }}/build/release-notes.md
          TERMOUS_VERSION: ${{ needs.metadata.outputs.version }}
        run: ./web/scripts/ci/extract-changelog.ps1
      - name: Create or update Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ github.workspace }}/build/release-notes.md
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != "true" ]]; then
              echo "标签已存在正式 Release，拒绝覆盖: $TAG" >&2
              exit 1
            fi
            confirmed="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft)"
            [[ "$confirmed" == "true" ]] || {
              echo "Release 已不再是 Draft，拒绝更新。" >&2
              exit 1
            }
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Termous $VERSION" --notes-file "$RELEASE_NOTES" \
              --draft --prerelease="$PRERELEASE"
          else
            args=(--repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "Termous $VERSION" --notes-file "$RELEASE_NOTES")
            [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
            gh release create "$TAG" "${args[@]}"
          fi
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            runner: windows-latest
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
          - platform: macos
            arch: arm64
            runner: macos-15
    env:
      TERMOUS_ARCH: ${{ matrix.arch }}
      TERMOUS_OUTPUT_DIR: ${{ github.workspace }}/termous-buildtools/build
      TERMOUS_RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
      TERMOUS_VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Checkout pinned Web
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare-release.outputs.termous_sha }}
          path: web
          persist-credentials: false
      - name: Checkout buildtools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Countra/termous-buildtools
          ref: ${{ needs.prepare-release.outputs.buildtools_sha }}
          path: termous-buildtools
          token: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}
          persist-credentials: false
      - name: Prepare unified build environment
        uses: ./web/.github/actions/buildtoolchain
        with:
          platform: ${{ matrix.platform }}
          source-lock: ${{ needs.prepare-release.outputs.source_lock }}
          token: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}
      - name: Skip repeated tests for release
        shell: python
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          import json
          import os
          from pathlib import Path

          config_path = Path("termous-buildtools/configs") / f"ci.{os.environ['TARGET_PLATFORM']}.json"
          config = json.loads(config_path.read_text(encoding="utf-8"))
          config["checks"]["tests"] = False
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
      - name: Build and verify desktop package
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TERMOUS_ELECTRON_ACCEPTANCE_NO_SANDBOX: ${{ matrix.platform == 'linux' && '1' || '0' }}
          TERMOUS_REPOSITORIES_READ_TOKEN: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}
        run: |
          args=(termous-buildtools/build.py build --config "termous-buildtools/configs/ci.$TARGET_PLATFORM.json" --source-lock termous-buildtools/build/work/source-lock.json)
          if [[ -n "${TERMOUS_VERSION:-}" ]]; then args+=(--version "$TERMOUS_VERSION"); fi
          if [[ "$TARGET_PLATFORM" == "linux" ]]; then xvfb-run -a python "${args[@]}"; else python "${args[@]}"; fi
      - name: Create Windows asset receipts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:TERMOUS_OUTPUT_DIR "install"
          $exe = "Termous-$env:TERMOUS_VERSION-windows-x64-setup.exe"
          node termous-buildtools/build/work/sources/web/scripts/ci/verify-release-assets.mjs receipt --version $env:TERMOUS_VERSION `
            --platform windows --arch x64 --asset (Join-Path $root $exe) `
            --manifest (Join-Path $root "latest.yml") --output (Join-Path $root "$exe.receipt.json")
          $blockmap = "$exe.blockmap"
          node termous-buildtools/build/work/sources/web/scripts/ci/verify-release-assets.mjs receipt --version $env:TERMOUS_VERSION `
            --platform windows --arch x64 --asset (Join-Path $root $blockmap) `
            --output (Join-Path $root "$blockmap.receipt.json")
      - name: Create Unix asset receipts
        if: matrix.platform != 'windows'
        shell: bash
        env:
          RELEASE_DATE: ${{ needs.prepare-release.outputs.release_date }}
        run: |
          root="$TERMOUS_OUTPUT_DIR/install"
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            asset="Termous-$TERMOUS_VERSION-linux-x64.AppImage"
            node termous-buildtools/build/work/sources/web/scripts/ci/verify-release-assets.mjs receipt --version "$TERMOUS_VERSION" \
              --platform linux --arch x64 --asset "$root/$asset" \
              --manifest "$root/latest-linux.yml" --output "$root/$asset.receipt.json"
          else
            base="Termous-$TERMOUS_VERSION-macos-$TERMOUS_ARCH"
            for extension in dmg zip; do
              asset="$base.$extension"
              node termous-buildtools/build/work/sources/web/scripts/ci/verify-release-assets.mjs receipt --version "$TERMOUS_VERSION" \
                --platform macos --arch "$TERMOUS_ARCH" --asset "$root/$asset" \
                --manifest "$root/latest-mac.yml" --output "$root/$asset.receipt.json"
            done
            sidecar="$base.zip.blockmap"
            node termous-buildtools/build/work/sources/web/scripts/ci/verify-release-assets.mjs receipt --version "$TERMOUS_VERSION" \
              --platform macos --arch "$TERMOUS_ARCH" --asset "$root/$sidecar" \
              --output "$root/$sidecar.receipt.json"
          fi
      - name: Upload Windows Draft assets
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:TERMOUS_OUTPUT_DIR "install"
          $exe = "Termous-$env:TERMOUS_VERSION-windows-x64-setup.exe"
          $assets = @($exe, "$exe.blockmap", "latest.yml", "$exe.receipt.json", "$exe.blockmap.receipt.json") |
            ForEach-Object { (Resolve-Path -LiteralPath (Join-Path $root $_)).Path }
          $draft = & gh release view $env:TERMOUS_RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
            --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $draft.Trim() -ne "true") {
            throw "Release 已不再是 Draft，拒绝上传 Windows 资产。"
          }
          & gh release upload $env:TERMOUS_RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "上传 Windows Draft Assets 失败。" }
      - name: Upload Unix Draft assets
        if: matrix.platform != 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assert_draft() {
            local draft
            draft="$(gh release view "$TERMOUS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft)"
            [[ "$draft" == "true" ]] || {
              echo "Release 已不再是 Draft，拒绝上传 Unix 资产。" >&2
              exit 1
            }
          }
          root="$TERMOUS_OUTPUT_DIR/install"
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            asset="Termous-$TERMOUS_VERSION-linux-x64.AppImage"
            assets=("$root/$asset" "$root/latest-linux.yml" "$root/$asset.receipt.json")
          else
            base="Termous-$TERMOUS_VERSION-macos-$TERMOUS_ARCH"
            assets=(
              "$root/$base.dmg" "$root/$base.zip" "$root/$base.zip.blockmap"
              "$root/latest-mac.yml"
              "$root/$base.dmg.receipt.json" "$root/$base.zip.receipt.json"
              "$root/$base.zip.blockmap.receipt.json"
            )
          fi
          assert_draft
          gh release upload "$TERMOUS_RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
  verify-release:
    name: Verify receipts and clean Draft assets
    needs:
      - prepare-release
      - build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    outputs:
      content_fingerprint: ${{ steps.trusted-assets.outputs.content_fingerprint }}
    steps:
      - name: Checkout Termous
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare-release.outputs.termous_sha }}
          path: web
          persist-credentials: false
      - name: Prepare release verifier
        uses: ./web/.github/actions/release-tools
      - name: Download Draft evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          mkdir -p build/release-evidence/assets
          node web/scripts/ci/verify-release-assets.mjs release-json \
            --tag "$TAG" --github-repository "$GITHUB_REPOSITORY" \
            --token-env GH_TOKEN \
            --output build/release-evidence/release.receipts.json
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir build/release-evidence/assets
      - name: Verify manifests, receipts and digests
        id: trusted-assets
        shell: bash
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          result="$(
            node web/scripts/ci/verify-release-assets.mjs verify \
              --version "$VERSION" --tag "$TAG" --phase receipts \
              --release-json build/release-evidence/release.receipts.json \
              --assets-dir build/release-evidence/assets
          )"
          echo "$result"
          content_fingerprint="$(printf '%s' "$result" | jq -r .contentFingerprint)"
          [[ "$content_fingerprint" =~ ^[a-f0-9]{64}$ ]] || {
            echo "可信 Release 内容指纹无效。" >&2
            exit 1
          }
          echo "content_fingerprint=$content_fingerprint" >> "$GITHUB_OUTPUT"
      - name: Delete temporary receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          mapfile -t receipts < <(
            jq -r \
              '.assets[] | select(.name | endswith(".receipt.json")) | .name' \
              build/release-evidence/release.receipts.json
          )
          (( ${#receipts[@]} > 0 )) || { echo "未找到待清理的 receipt。" >&2; exit 1; }
          for receipt in "${receipts[@]}"; do
            draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft)"
            [[ "$draft" == "true" ]] || {
              echo "Release 已不再是 Draft，拒绝删除 receipt。" >&2
              exit 1
            }
            gh release delete-asset "$TAG" "$receipt" --yes --repo "$GITHUB_REPOSITORY"
          done
  verify-final-release:
    name: Verify final Draft Release assets
    needs:
      - prepare-release
      - verify-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      content_fingerprint: ${{ needs.verify-release.outputs.content_fingerprint }}
    steps:
      - name: Checkout Termous
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare-release.outputs.termous_sha }}
          path: web
          persist-credentials: false
      - name: Prepare release verifier
        uses: ./web/.github/actions/release-tools
      - name: Verify final public asset set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          TRUSTED_CONTENT_FINGERPRINT: ${{ needs.verify-release.outputs.content_fingerprint }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          result="$(
            node web/scripts/ci/verify-release-assets.mjs verify \
              --version "$VERSION" --tag "$TAG" --phase final \
              --github-repository "$GITHUB_REPOSITORY" --token-env GH_TOKEN
          )"
          echo "$result"
          current="$(printf '%s' "$result" | jq -r .contentFingerprint)"
          [[ "$current" == "$TRUSTED_CONTENT_FINGERPRINT" ]] || {
            echo "最终 Release 内容已偏离 manifest、receipt 与摘要门禁。" >&2
            exit 1
          }
  publish:
    name: Publish GitHub Release
    needs:
      - prepare-release
      - verify-final-release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout pinned Termous
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare-release.outputs.termous_sha }}
          path: web
          persist-credentials: false
      - name: Prepare release verifier
        uses: ./web/.github/actions/release-tools
      - name: Re-verify final Draft after environment approval
        id: final-verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          TRUSTED_CONTENT_FINGERPRINT: ${{ needs.verify-final-release.outputs.content_fingerprint }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          result="$(
            node web/scripts/ci/verify-release-assets.mjs verify \
              --version "$VERSION" --tag "$TAG" --phase final \
              --github-repository "$GITHUB_REPOSITORY" --token-env GH_TOKEN
          )"
          echo "$result"
          content_fingerprint="$(printf '%s' "$result" | jq -r .contentFingerprint)"
          [[ "$content_fingerprint" == "$TRUSTED_CONTENT_FINGERPRINT" ]] || {
            echo "环境审批后的 Release 内容已偏离 manifest、receipt 与摘要门禁。" >&2
            exit 1
          }
          fingerprint="$(printf '%s' "$result" | jq -r .releaseFingerprint)"
          [[ "$fingerprint" =~ ^[a-f0-9]{64}$ ]] || {
            echo "最终 Release 快照指纹无效。" >&2
            exit 1
          }
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Publish verified Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.prepare-release.outputs.termous_sha }}
          EXPECTED_FINGERPRINT: ${{ steps.final-verification.outputs.fingerprint }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          resolve_tag_commit() {
            local object_sha object_type response
            response="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
            object_type="$(jq -r .object.type <<< "$response")"
            object_sha="$(jq -r .object.sha <<< "$response")"
            for _ in 1 2 3 4 5 6 7 8; do
              if [[ "$object_type" == "commit" ]]; then
                printf '%s' "$object_sha"
                return 0
              fi
              [[ "$object_type" == "tag" && "$object_sha" =~ ^[a-f0-9]{40}$ ]] || {
                echo "Release 标签没有解析到可信 commit。" >&2
                return 1
              }
              response="$(
                gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha"
              )"
              object_type="$(jq -r .object.type <<< "$response")"
              object_sha="$(jq -r .object.sha <<< "$response")"
            done
            echo "Release 标签嵌套层级超过安全上限。" >&2
            return 1
          }
          tag_commit="$(resolve_tag_commit)"
          [[ "$tag_commit" == "$EXPECTED_COMMIT" ]] || {
            echo "Release 标签在构建后发生移动，拒绝公开。" >&2
            exit 1
          }
          release_json="$(mktemp)"
          trap 'rm -f "$release_json"' EXIT
          node web/scripts/ci/verify-release-assets.mjs release-json \
            --tag "$TAG" --github-repository "$GITHUB_REPOSITORY" \
            --token-env GH_TOKEN --output "$release_json"
          draft="$(jq -r .draft "$release_json")"
          [[ "$draft" == "true" ]] || { echo "Release 已不是 Draft。" >&2; exit 1; }
          temporary="$(
            jq '[.assets[].name | select(endswith(".receipt.json") or contains(".partial."))] | length' \
              "$release_json"
          )"
          [[ "$temporary" == "0" ]] || { echo "Release 仍包含临时资产。" >&2; exit 1; }
          current_snapshot="$(
            jq -c '[
              .id,
              .tag_name,
              .draft,
              .prerelease,
              .body,
              (.assets
                | map([.url, .name, .size, (.digest // null), (.updated_at // null)])
                | sort_by(.[0]))
            ]' "$release_json"
          )"
          current_fingerprint="$(
            printf '%s' "$current_snapshot" |
              sha256sum |
              awk '{ print $1 }'
          )"
          [[ "$current_fingerprint" == "$EXPECTED_FINGERPRINT" ]] || {
            echo "环境审批后的 Release 资产快照发生变化，拒绝公开。" >&2
            exit 1
          }
          release_id="$(jq -r .id "$release_json")"
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "最终 Release ID 无效。" >&2
            exit 1
          }
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false > /dev/null
