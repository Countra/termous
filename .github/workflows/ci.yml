name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web quality checks
    needs:
      - resolve-core
      - resolve-skills
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: web

      - name: Checkout pinned Termous Skills
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 固定版本 v6.0.2
        with:
          repository: Countra/termous-skills
          ref: ${{ needs.resolve-skills.outputs.sha }}
          path: termous-skills
          persist-credentials: false

      - name: Checkout pinned remote core
        uses: ./web/.github/actions/remote-checkout
        with:
          repository: ${{ needs.resolve-core.outputs.remote_repository }}
          revision: ${{ needs.resolve-core.outputs.remote_sha }}
          token: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}

      - name: Checkout pinned RDP worker
        uses: ./web/.github/actions/rdp-checkout
        with:
          repository: ${{ needs.resolve-core.outputs.rdp_repository }}
          revision: ${{ needs.resolve-core.outputs.rdp_sha }}
          token: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: web/package.json
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install shared protocol dependencies
        run: pnpm --dir "${{ github.workspace }}/termous-remote" install --frozen-lockfile

      - name: Install RDP protocol dependencies
        run: pnpm --dir "${{ github.workspace }}/termous-rdp" install --frozen-lockfile

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm run typecheck

  resolve-core:
    name: Resolve matching Termous Core commit
    if: github.repository == 'Countra/termous' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      sha: ${{ steps.core.outputs.sha }}
      remote_repository: ${{ steps.dependencies.outputs.remote_repository }}
      remote_sha: ${{ steps.dependencies.outputs.remote_sha }}
      rdp_repository: ${{ steps.dependencies.outputs.rdp_repository }}
      rdp_sha: ${{ steps.dependencies.outputs.rdp_sha }}

    steps:
      - name: Resolve platform matrix
        id: matrix
        shell: bash
        env:
          FRONTEND_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          matrix="$(
            jq -cn --arg branch "$FRONTEND_BRANCH" '
              {
                include: (
                  [
                    {
                      platform: "windows",
                      target_os: "win32",
                      arch: "x64",
                      runner: "windows-latest"
                    },
                    {
                      platform: "linux",
                      target_os: "linux",
                      arch: "x64",
                      runner: "ubuntu-24.04"
                    }
                  ] + (
                    if $branch == "main" then
                      [
                        {
                          platform: "macos",
                          target_os: "darwin",
                          arch: "x64",
                          runner: "macos-15-intel"
                        },
                        {
                          platform: "macos",
                          target_os: "darwin",
                          arch: "arm64",
                          runner: "macos-15"
                        }
                      ]
                    else
                      []
                    end
                  )
                )
              }
            '
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Resolve matching branch or main
        id: core
        shell: bash
        env:
          DEFAULT_CORE_BRANCH: main
          FRONTEND_BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "缺少读取 Termous Core 的 TERMOUS_REPOSITORIES_READ_TOKEN。" >&2
            exit 1
          fi

          response="$(
            gh api graphql \
              -f query='
                query(
                  $owner: String!
                  $repository: String!
                  $matchingRef: String!
                  $fallbackRef: String!
                ) {
                  repository(owner: $owner, name: $repository) {
                    matching: ref(qualifiedName: $matchingRef) {
                      target {
                        oid
                      }
                    }
                    fallback: ref(qualifiedName: $fallbackRef) {
                      target {
                        oid
                      }
                    }
                  }
                }
              ' \
              -f owner='Countra' \
              -f repository='termous-core' \
              -f matchingRef="refs/heads/$FRONTEND_BRANCH" \
              -f fallbackRef="refs/heads/$DEFAULT_CORE_BRANCH"
          )"

          graphql_errors="$(
            jq -r '(.errors // []) | map(.message) | join("; ")' <<<"$response"
          )"
          if [[ -n "$graphql_errors" ]]; then
            echo "查询 Termous Core 分支失败: $graphql_errors" >&2
            exit 1
          fi
          if ! jq -e '.data.repository | type == "object"' \
            >/dev/null <<<"$response"; then
            echo "Termous Core 仓库响应缺少有效数据。" >&2
            exit 1
          fi

          matching_sha="$(
            jq -r '.data.repository.matching.target.oid // empty' <<<"$response"
          )"
          fallback_sha="$(
            jq -r '.data.repository.fallback.target.oid // empty' <<<"$response"
          )"

          if [[ -n "$matching_sha" ]]; then
            selected_branch="$FRONTEND_BRANCH"
            selected_sha="$matching_sha"
          else
            selected_branch="$DEFAULT_CORE_BRANCH"
            selected_sha="$fallback_sha"
            echo "Core 不存在同名分支 $FRONTEND_BRANCH，回退到 $DEFAULT_CORE_BRANCH。"
          fi

          if [[ ! "$selected_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "无法把 Core 分支 $selected_branch 解析为 40 位 commit SHA。" >&2
            exit 1
          fi

          echo "前端分支: $FRONTEND_BRANCH"
          echo "Core 分支: $selected_branch"
          echo "Core commit: $selected_sha"
          echo "sha=$selected_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout Termous for dependency resolution
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: web
          persist-credentials: false

      - name: Checkout pinned Termous Core
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Countra/termous-core
          ref: ${{ steps.core.outputs.sha }}
          path: backend
          token: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}
          persist-credentials: false

      - name: Setup Go for dependency resolution
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Setup Node.js for dependency resolution
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: web/package.json
          package-manager-cache: false

      - name: Resolve shared dependencies from Core
        id: dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}
        run: node web/scripts/ci/resolve-core-dependencies.mjs backend

  resolve-skills:
    name: Resolve matching Termous Skills commit
    if: github.repository == 'Countra/termous'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.skills.outputs.sha }}
    steps:
      - name: Resolve matching branch or main
        id: skills
        shell: bash
        env:
          DEFAULT_SKILLS_BRANCH: main
          FRONTEND_BRANCH: ${{ github.head_ref || github.ref_name }}
          SKILLS_REPOSITORY: Countra/termous-skills
        run: |
          set -Eeuo pipefail
          refs="$(
            git ls-remote --refs --heads \
              "$GITHUB_SERVER_URL/$SKILLS_REPOSITORY.git" \
              "refs/heads/$FRONTEND_BRANCH" \
              "refs/heads/$DEFAULT_SKILLS_BRANCH"
          )"
          matching_sha="$(
            awk -v ref="refs/heads/$FRONTEND_BRANCH" \
              '$2 == ref { print $1; exit }' <<<"$refs"
          )"
          fallback_sha="$(
            awk -v ref="refs/heads/$DEFAULT_SKILLS_BRANCH" \
              '$2 == ref { print $1; exit }' <<<"$refs"
          )"

          if [[ -n "$matching_sha" ]]; then
            selected_branch="$FRONTEND_BRANCH"
            selected_sha="$matching_sha"
          else
            selected_branch="$DEFAULT_SKILLS_BRANCH"
            selected_sha="$fallback_sha"
            echo "Skills 不存在同名分支 $FRONTEND_BRANCH，回退到 $DEFAULT_SKILLS_BRANCH。"
          fi

          if [[ ! "$selected_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "无法把 Skills 分支 $selected_branch 解析为 40 位 commit SHA。" >&2
            exit 1
          fi
          echo "Skills 分支: $selected_branch"
          echo "Skills commit: $selected_sha"
          echo "sha=$selected_sha" >> "$GITHUB_OUTPUT"

  web-renderer:
    name: Web production renderer build
    needs:
      - resolve-core
      - resolve-skills
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 固定版本 v6.0.2
        with:
          path: web

      - name: Checkout pinned remote core
        uses: ./web/.github/actions/remote-checkout
        with:
          repository: ${{ needs.resolve-core.outputs.remote_repository }}
          revision: ${{ needs.resolve-core.outputs.remote_sha }}
          token: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}

      - name: Checkout pinned RDP worker
        uses: ./web/.github/actions/rdp-checkout
        with:
          repository: ${{ needs.resolve-core.outputs.rdp_repository }}
          revision: ${{ needs.resolve-core.outputs.rdp_sha }}
          token: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # 固定版本 v4.4.0
        with:
          package_json_file: web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 固定版本 v6.4.0
        with:
          node-version-file: web/package.json
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install shared protocol dependencies
        run: pnpm --dir "${{ github.workspace }}/termous-remote" install --frozen-lockfile

      - name: Install RDP protocol dependencies
        run: pnpm --dir "${{ github.workspace }}/termous-rdp" install --frozen-lockfile

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkout pinned Termous Core for Agent Skills validation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 固定版本 v6.0.2
        with:
          repository: Countra/termous-core
          ref: ${{ needs.resolve-core.outputs.sha }}
          path: backend
          token: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}
          persist-credentials: false

      - name: Checkout pinned Termous Skills
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 固定版本 v6.0.2
        with:
          repository: Countra/termous-skills
          ref: ${{ needs.resolve-skills.outputs.sha }}
          path: termous-skills
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # 固定版本 v5.4.0
        with:
          python-version: '3.13'

      - name: Install Skills validation dependencies
        run: python -m pip install -r ../termous-skills/requirements-dev.txt

      - name: Build renderer
        env:
          TERMOUS_CORE_DIR: ${{ github.workspace }}/backend
          TERMOUS_SKILLS_DIR: ${{ github.workspace }}/termous-skills/skills
        run: pnpm run build:renderer

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs:
      - resolve-core
      - resolve-skills
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-core.outputs.matrix) }}
    env:
      GOWORK: "off"
      GOPRIVATE: github.com/Countra/termous-rdp,github.com/Countra/termous-remote
      TERMOUS_ARCH: ${{ matrix.arch }}
      TERMOUS_CORE_DIR: ${{ github.workspace }}/backend
      TERMOUS_OUTPUT_DIR: ${{ github.workspace }}/build/${{ matrix.platform }}-${{ matrix.arch }}
      TERMOUS_SKILLS_DIR: ${{ github.workspace }}/termous-skills/skills
      TERMOUS_TARGET_OS: ${{ matrix.target_os }}
      TERMOUS_VERSION: 0.0.0-ci
      TERMOUS_WEB_DIR: ${{ github.workspace }}/web

    steps:
      - name: Checkout Termous
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 固定版本 v6.0.2
        with:
          ref: ${{ github.sha }}
          path: web
          persist-credentials: false

      - name: Checkout pinned Termous Core
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 固定版本 v6.0.2
        with:
          repository: Countra/termous-core
          ref: ${{ needs.resolve-core.outputs.sha }}
          path: backend
          token: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}
          persist-credentials: false

      - name: Checkout pinned Termous Skills
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 固定版本 v6.0.2
        with:
          repository: Countra/termous-skills
          ref: ${{ needs.resolve-skills.outputs.sha }}
          path: termous-skills
          persist-credentials: false

      - name: Checkout pinned remote core
        uses: ./web/.github/actions/remote-checkout
        with:
          repository: ${{ needs.resolve-core.outputs.remote_repository }}
          revision: ${{ needs.resolve-core.outputs.remote_sha }}
          token: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}

      - name: Checkout pinned RDP worker
        uses: ./web/.github/actions/rdp-checkout
        with:
          repository: ${{ needs.resolve-core.outputs.rdp_repository }}
          revision: ${{ needs.resolve-core.outputs.rdp_sha }}
          token: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # 固定版本 v4.4.0
        with:
          cache: false
          package_json_file: web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 固定版本 v6.4.0
        with:
          node-version-file: web/package.json
          package-manager-cache: false

      - name: Install shared protocol dependencies
        run: pnpm --dir "${{ github.workspace }}/termous-remote" install --frozen-lockfile

      - name: Install RDP protocol dependencies
        run: pnpm --dir "${{ github.workspace }}/termous-rdp" install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # 固定版本 v6.4.0
        with:
          go-version: ${{ vars.GO_VERSION }}
          go-version-file: ${{ !vars.GO_VERSION && 'backend/go.mod' || '' }}
          cache: false

      - name: Download pinned private modules
        shell: bash
        working-directory: backend
        env:
          TERMOUS_REPOSITORIES_READ_TOKEN: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}
        run: |
          export GIT_TERMINAL_PROMPT=0
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TERMOUS_REPOSITORIES_READ_TOKEN" | base64 | tr -d '\r\n')"
          printf '::add-mask::%s\n' "$auth_header"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/Countra/.extraheader
          export GIT_CONFIG_VALUE_0="$auth_header"
          go mod download termous/rdp termous/remote

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # 固定版本 v5.4.0
        with:
          python-version: '3.13'

      - name: Install Skills validation dependencies
        shell: bash
        run: python -m pip install -r termous-skills/requirements-dev.txt

      - name: Install Linux build and packaging dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libfuse3-dev libopenjp2-tools libasound2-dev

      - name: Install macOS build dependencies
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          if [[ ! -f /usr/local/include/fuse/fuse.h &&
                ! -f /usr/local/include/osxfuse/fuse/fuse.h &&
                ! -f /Library/Frameworks/macFUSE.framework/Headers/fuse.h &&
                ! -f /opt/homebrew/include/fuse/fuse.h ]]; then
            brew install --cask macfuse
          fi

      - name: Setup Windows MSYS2 toolchain
        if: matrix.platform == 'windows'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          cache: false
          install: mingw-w64-x86_64-gcc

      - name: Test Windows build prerequisites
        if: matrix.platform == 'windows'
        shell: pwsh
        run: node --test web/scripts/ci/go-build-command.test.mjs

      - name: Prepare Windows build
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TERMOUS_BUILD_PHASE: prepare
          TERMOUS_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./web/scripts/ci/build-windows.ps1

      - name: Test Unix build prerequisites
        if: matrix.platform != 'windows'
        shell: bash
        run: node --test web/scripts/ci/build-unix.test.mjs

      - name: Prepare Unix build
        if: matrix.platform != 'windows'
        shell: bash
        env:
          TERMOUS_BUILD_PHASE: prepare
        run: bash ./web/scripts/ci/build-unix.sh

      - name: Package Windows release
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TERMOUS_BUILD_PHASE: package
        run: ./web/scripts/ci/build-windows.ps1

      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        env:
          TERMOUS_BUILD_PHASE: package
        run: bash ./web/scripts/ci/build-unix.sh

      - name: Package macOS release
        if: matrix.platform == 'macos'
        shell: bash
        env:
          TERMOUS_BUILD_PHASE: package
        run: bash ./web/scripts/ci/build-unix.sh
