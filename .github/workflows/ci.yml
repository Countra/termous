name: CI
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  sources:
    name: Resolve unified source lock
    if: github.repository == 'Countra/termous' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      source_lock: ${{ steps.sources.outputs.source_lock }}
      buildtools_sha: ${{ steps.sources.outputs.buildtools_sha }}
    steps:
      - name: Checkout pinned Web
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: web
          persist-credentials: false
      - name: Checkout buildtools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Countra/termous-buildtools
          ref: main
          path: termous-buildtools
          token: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Resolve matching branches once
        id: sources
        shell: bash
        env:
          WEB_SHA: ${{ github.sha }}
          WEB_BRANCH: ${{ github.head_ref || github.ref_name }}
          TERMOUS_REPOSITORIES_READ_TOKEN: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}
        run: python termous-buildtools/ci.py resolve --web-sha "$WEB_SHA" --matching-branch "$WEB_BRANCH"
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: sources
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            runner: windows-latest
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
          - platform: macos
            arch: arm64
            runner: macos-15
    steps:
      - name: Checkout pinned Web
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: web
          persist-credentials: false
      - name: Checkout buildtools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Countra/termous-buildtools
          ref: ${{ needs.sources.outputs.buildtools_sha }}
          path: termous-buildtools
          token: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}
          persist-credentials: false
      - name: Prepare unified build environment
        uses: ./web/.github/actions/buildtoolchain
        with:
          platform: ${{ matrix.platform }}
          source-lock: ${{ needs.sources.outputs.source_lock }}
          token: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}
      - name: Build and verify desktop package
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TERMOUS_ELECTRON_ACCEPTANCE_NO_SANDBOX: ${{ matrix.platform == 'linux' && '1' || '0' }}
          TERMOUS_REPOSITORIES_READ_TOKEN: ${{ secrets.TERMOUS_REPOSITORIES_READ_TOKEN }}
        run: |
          args=(termous-buildtools/build.py build --config "termous-buildtools/configs/ci.$TARGET_PLATFORM.json" --source-lock termous-buildtools/build/work/source-lock.json)
          if [[ -n "${TERMOUS_VERSION:-}" ]]; then args+=(--version "$TERMOUS_VERSION"); fi
          if [[ "$TARGET_PLATFORM" == "linux" ]]; then xvfb-run -a python "${args[@]}"; else python "${args[@]}"; fi
