name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0-beta"
        required: true
        default: "0.1.0"
      core_ref:
        description: "termous-core ref, tag, branch, or commit SHA. Tag releases use the same tag by default."
        required: false
        default: "main"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    environment: release
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Resolve release metadata
        id: meta
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "${{ github.ref_name }}"
            if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
            }
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Release version is empty."
          }

          $coreRef = "${{ github.event.inputs.core_ref }}"
          if ([string]::IsNullOrWhiteSpace($coreRef)) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $coreRef = "${{ github.ref_name }}"
            } else {
              $coreRef = "${{ vars.TERMOUS_CORE_REF }}"
            }
          }
          if ([string]::IsNullOrWhiteSpace($coreRef)) {
            $coreRef = "main"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "core_ref=$coreRef" >> $env:GITHUB_OUTPUT

      - name: Validate secrets
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TERMOUS_CORE_READ_TOKEN }}")) {
            throw "TERMOUS_CORE_READ_TOKEN is required to checkout Countra/termous-core."
          }

      - name: Configure Windows code signing
        run: |
          $cscLink = "${{ secrets.CSC_LINK }}"
          $cscPassword = "${{ secrets.CSC_KEY_PASSWORD }}"
          if ([string]::IsNullOrWhiteSpace($cscLink)) {
            "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $env:GITHUB_ENV
            Write-Host "Windows code signing disabled; unsigned installer will be built."
          } else {
            "CSC_LINK=$cscLink" >> $env:GITHUB_ENV
            if (-not [string]::IsNullOrWhiteSpace($cscPassword)) {
              "CSC_KEY_PASSWORD=$cscPassword" >> $env:GITHUB_ENV
            }
            Write-Host "Windows code signing enabled."
          }

      - name: Checkout Termous
        uses: actions/checkout@v4
        with:
          path: web

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TERMOUS_CHANGELOG_FILE: ${{ github.workspace }}\web\docs\CHANGELOG.md
          TERMOUS_RELEASE_NOTES_FILE: ${{ github.workspace }}\build\release-notes.md
          TERMOUS_VERSION: ${{ steps.meta.outputs.version }}
        run: .\web\scripts\ci\extract-changelog.ps1

      - name: Checkout Termous Core
        uses: actions/checkout@v4
        with:
          repository: Countra/termous-core
          ref: ${{ steps.meta.outputs.core_ref }}
          path: backend
          token: ${{ secrets.TERMOUS_CORE_READ_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ vars.PNPM_VERSION || '10' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ vars.GO_VERSION || '1.25.x' }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build installer
        env:
          TERMOUS_WEB_DIR: ${{ github.workspace }}\web
          TERMOUS_CORE_DIR: ${{ github.workspace }}\backend
          TERMOUS_OUTPUT_DIR: ${{ github.workspace }}\build\windows
          TERMOUS_VERSION: ${{ steps.meta.outputs.version }}
        run: .\web\scripts\ci\build-windows.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Termous-Windows-${{ steps.meta.outputs.version }}
          path: |
            build/windows/installer/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Termous ${{ steps.meta.outputs.version }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
          body_path: build/release-notes.md
          files: |
            build/windows/installer/*.exe
            build/windows/installer/*.blockmap
            build/windows/installer/latest.yml
