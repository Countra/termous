name: Checkout pinned RDP worker
description: 检出经过审查的 RDP 合同和原生 worker
inputs:
  repository:
    required: true
    description: RDP 仓库 owner/name
  revision:
    required: true
    description: 完整提交 SHA
  token:
    required: true
    description: RDP 仓库只读令牌
runs:
  using: composite
  steps:
    - name: Validate pinned revision
      shell: bash
      env:
        RDP_REPOSITORY: ${{ inputs.repository }}
        RDP_REVISION: ${{ inputs.revision }}
      run: |
        if [[ ! "$RDP_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ || ! "$RDP_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Core 依赖解析结果必须包含有效仓库名称与完整提交 SHA。" >&2
          exit 1
        fi
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.revision }}
        token: ${{ inputs.token }}
        path: termous-rdp
        persist-credentials: false
