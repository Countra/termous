name: Prepare release verification
description: 仅安装发布验证器需要的 YAML 依赖，不编译应用或获取业务仓库
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: web/package.json
        package-manager-cache: false
    - name: Install verifier dependency
      shell: bash
      run: |
        version="$(node -p "require('./web/package.json').devDependencies.yaml")"
        npm install --prefix web/scripts/ci --ignore-scripts --no-package-lock --no-save "yaml@$version"
