name: Checkout pinned remote core
description: 检出经过审查的共享远控合同和核心
inputs:
  repository:
    required: true
    description: 共享仓库 owner/name
  revision:
    required: true
    description: 完整提交 SHA
  token:
    required: true
    description: 共享仓库只读令牌
runs:
  using: composite
  steps:
    - name: Validate pinned revision
      shell: bash
      env:
        REMOTE_REPOSITORY: ${{ inputs.repository }}
        REMOTE_REVISION: ${{ inputs.revision }}
      run: |
        if [[ ! "$REMOTE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ || ! "$REMOTE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
          echo "请配置 TERMOUS_REMOTE_REPOSITORY 和完整的 TERMOUS_REMOTE_SHA，禁止使用浮动分支。" >&2
          exit 1
        fi
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.revision }}
        token: ${{ inputs.token }}
        path: termous-remote
        persist-credentials: false
